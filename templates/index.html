<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Compressor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Media Compressor</h1>
        <p>Batch compress images and videos with configurable encoding profiles</p>
    </header>

    <div class="card">
        <h2>New Compression Job</h2>
        <form id="folder-form">
            <div class="form-group">
                <label for="inputFolderPath">Input Folder Path</label>
                <input type="text" id="inputFolderPath" name="inputFolderPath" required
                       placeholder="C:\Photos\input or /home/user/photos">
            </div>
            <div class="form-group">
                <label for="outputFolderPath">Output Folder Path</label>
                <input type="text" id="outputFolderPath" name="outputFolderPath" required
                       placeholder="C:\Photos\output or /home/user/photos-compressed">
            </div>
            <div class="form-group">
                <label for="profile">Compression Profile</label>
                <select id="profile" name="profile"></select>
            </div>
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="0">Low (0)</option>
                    <option value="5" selected>Normal (5)</option>
                    <option value="10">High (10)</option>
                </select>
            </div>
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="preserve-metadata" checked>
                    Preserve metadata (EXIF/XMP)
                </label>
            </div>

            <details class="advanced-settings">
                <summary>Advanced Settings</summary>
                <div class="settings-grid">
                    <div class="settings-section">
                        <h4>Image Settings</h4>
                        <div class="form-group">
                            <label for="image-format">Output Format</label>
                            <select id="image-format">
                                <option value="webp">WebP</option>
                                <option value="jpeg">JPEG</option>
                                <option value="png">PNG</option>
                                <option value="avif">AVIF</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="image-quality">Quality: <span id="image-quality-val">75</span></label>
                            <input type="range" id="image-quality" min="1" max="100" value="75">
                        </div>
                        <div class="form-group">
                            <label for="image-max-dim">Max Dimension (px)</label>
                            <input type="number" id="image-max-dim" placeholder="No limit">
                        </div>
                        <div class="form-group checkbox-group">
                            <label><input type="checkbox" id="image-lossless"> Lossless</label>
                        </div>
                        <div class="form-group checkbox-group">
                            <label><input type="checkbox" id="image-strip-meta"> Strip metadata</label>
                        </div>
                    </div>
                    <div class="settings-section">
                        <h4>Video Settings</h4>
                        <div class="form-group">
                            <label for="video-codec">Codec</label>
                            <select id="video-codec">
                                <option value="libx265">H.265 (libx265)</option>
                                <option value="libx264">H.264 (libx264)</option>
                                <option value="libsvtav1">AV1 (libsvtav1)</option>
                                <option value="libvpx-vp9">VP9 (libvpx-vp9)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="video-container">Container</label>
                            <select id="video-container">
                                <option value="mkv">MKV</option>
                                <option value="mp4">MP4</option>
                                <option value="webm">WebM</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="video-crf">CRF: <span id="video-crf-val">28</span></label>
                            <input type="range" id="video-crf" min="0" max="51" value="28">
                        </div>
                        <div class="form-group">
                            <label for="video-preset">Preset</label>
                            <select id="video-preset">
                                <option value="ultrafast">Ultrafast</option>
                                <option value="superfast">Superfast</option>
                                <option value="veryfast">Veryfast</option>
                                <option value="faster">Faster</option>
                                <option value="fast">Fast</option>
                                <option value="medium">Medium</option>
                                <option value="slow" selected>Slow</option>
                                <option value="slower">Slower</option>
                                <option value="veryslow">Veryslow</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="video-audio-codec">Audio Codec</label>
                            <select id="video-audio-codec">
                                <option value="aac">AAC</option>
                                <option value="opus">Opus</option>
                                <option value="copy">Copy</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="video-audio-bitrate">Audio Bitrate</label>
                            <input type="text" id="video-audio-bitrate" value="128k">
                        </div>
                        <div class="form-group">
                            <label for="video-resolution">Resolution</label>
                            <select id="video-resolution">
                                <option value="original">Original</option>
                                <option value="1080p">1080p</option>
                                <option value="720p">720p</option>
                                <option value="480p">480p</option>
                                <option value="360p">360p</option>
                            </select>
                        </div>
                    </div>
                </div>
            </details>

            <button type="submit">Start Compression Job</button>
        </form>
    </div>

    <div id="status-message"></div>

    <div class="card queue-stats-card">
        <h2>Queue Statistics</h2>
        <div class="queue-stats" id="queue-counts">
            <div class="stat-item"><span class="stat-number" id="total-count">0</span><span class="stat-label">Total</span></div>
            <div class="stat-item"><span class="stat-number" id="pending-count">0</span><span class="stat-label">Pending</span></div>
            <div class="stat-item"><span class="stat-number" id="processing-count">0</span><span class="stat-label">Processing</span></div>
            <div class="stat-item"><span class="stat-number" id="completed-count">0</span><span class="stat-label">Completed</span></div>
            <div class="stat-item"><span class="stat-number" id="error-count">0</span><span class="stat-label">Errors</span></div>
        </div>
        <button class="danger" id="clear-completed-btn">Clear Completed Files</button>
    </div>

    <div class="card" id="jobs-section">
        <h2>Jobs <button class="small secondary" id="refresh-jobs">Refresh</button></h2>
        <div id="jobs-list"></div>
    </div>

    <div class="card">
        <h2>Compression Queue</h2>
        <div class="filters">
            <label>Status:
                <select id="file-status-filter">
                    <option value="">All</option>
                    <option value="0">Pending</option>
                    <option value="2">Processing</option>
                    <option value="1">Completed</option>
                    <option value="-1">Error</option>
                </select>
            </label>
            <label>Search:
                <input type="text" id="file-search" placeholder="Filter by path...">
            </label>
        </div>
        <ul id="file-list"></ul>
        <div class="pagination" id="file-pagination"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
